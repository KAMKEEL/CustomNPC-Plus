// CustomNPC-Plus — Root Project (Multi-Version Aggregator)
// Plain Gradle project that aggregates submodules.
// Each submodule (mc1710, mc1122, etc.) handles its own configuration.

// IntelliJ IDEA triggers 'processIdeaSettings' on the root project during Gradle sync.
// The GTNH convention plugin only registers this task on subprojects that apply it,
// so we register a no-op task here to prevent "task not found" errors.
tasks.register('processIdeaSettings') {
    group = 'ide'
    description = 'No-op task for IntelliJ IDEA Gradle sync compatibility'
}

// IDEA plugin at root level is required for GTNH convention's IdeIntegrationModule
// which references rootProject.idea extension from subprojects.
apply plugin: 'idea'
