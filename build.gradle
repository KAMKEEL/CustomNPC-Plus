// ============================================================================
// CustomNPC-Plus — Root Project (Multi-Version Coordinator)
// ============================================================================
//
// This root project is a lightweight coordinator for the multi-version build.
// It does NOT apply the GTNH convention plugin or RetroFuturaGradle directly.
// The GTNH settings convention plugin (applied in settings.gradle) requires
// buildscript repositories to be available for plugin resolution.
//
// Subprojects:
//   :platform-api  — MC-free interfaces (plain Java 8 library)
//   :core          — MC-free game logic (plain Java 8 library, depends on platform-api)
//   :mc1710        — Minecraft 1.7.10 Forge mod (GTNH convention + RFG, depends on core)
//
// Build commands:
//   ./gradlew build              — Build all modules
//   ./gradlew :mc1710:build      — Build only the MC 1.7.10 module
//   ./gradlew :mc1710:runClient  — Run the MC 1.7.10 client
//   ./gradlew :mc1710:runServer  — Run the MC 1.7.10 server
// ============================================================================

buildscript {
    repositories {
        maven {
            name "GTNH Maven"
            url "https://nexus.gtnewhorizons.com/repository/public/"
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

// IDEA plugin at root level is required for GTNH convention's IdeIntegrationModule
// which references rootProject.idea extension from subprojects.
apply plugin: 'idea'
