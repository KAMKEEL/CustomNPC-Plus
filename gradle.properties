# ========================
# Root Project Properties
# ========================
# These are settings-level properties consumed by the GTNH settings convention
# plugin and Gradle itself. Full mod-specific properties live in mc1710/gradle.properties.
#
# NOTE: The GTNH settings convention plugin validates several properties at settings
# evaluation time (before subproject gradle.properties are loaded). These must be
# present here even though they are also defined in mc1710/gradle.properties.

# Human-readable mod name, required by GTNH settings convention plugin.
modName = CustomNPC+

# Mod identifier, required by GTNH settings convention plugin.
modId = customnpcs

# Root package, required by GTNH settings convention plugin.
modGroup = noppes.npcs

# ExampleMod tag to use as Blowdryer (Spotless, etc.) settings version, leave empty to disable.
# LOCAL to test local config updates.
gtnh.settings.blowdryerTag = 0.2.2

# Whether to automatically set the version based on the VERSION environment variable or the current git status.
gtnh.modules.gitVersion = false

# Sets up code style plugins like Spotless and Checkstyle.
# Disabled at root level; mc1710 has its own code style settings.
gtnh.modules.codeStyle = false

# Disable code style checks (they are configured per-subproject as needed)
disableSpotless = true
disableCheckstyle = true

# Increase Gradle's JVM memory usage to avoid daemon expiration due to
# insufficient heap space on CI builds.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
