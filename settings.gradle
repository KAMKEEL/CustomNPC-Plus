    repositories {
        maven { url "https://jitpack.io"}
        maven {
            // RetroFuturaGradle
            name "GTNH Maven"
            url "https://nexus.gtnewhorizons.com/repository/public/"
            mavenContent {
                includeGroup("com.gtnewhorizons")
                includeGroupByRegex("com\\.gtnewhorizons\\..+")
            }
        }
        gradlePluginPortal()
        mavenCentral()
        mavenLocal()
    }
}

plugins {
    id 'com.gtnewhorizons.gtnhsettingsconvention' version '1.0.27'
}

// Include the local gradle-plugins composite build so plugin is resolved locally
includeBuild 'gradle-plugins'

// CNPC+ Multi-Version Build Structure
// - platform-api: MC-free interfaces (plain Java 8 library)
// - core: MC-free game logic (plain Java 8 library, depends on platform-api)
// - mc1710: Minecraft 1.7.10 module (Forge mod, depends on core)
include 'platform-api', 'core', 'mc1710'